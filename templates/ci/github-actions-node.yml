# GitHub Actions: Node.js/TypeScript プロジェクト用（DevSecOps強化版）
# .github/workflows/ci.yml にコピーして使用
#
# このファイルは以下の DevSecOps 原則に基づく:
#   - permissions: read-only を既定（最小権限）
#   - gitleaks でシークレット混入を毎push検出
#   - npm audit で依存脆弱性を検出
#   - semgrep で SAST（OWASP Top 10 + js + secrets）
#   - PR と push 双方でフルチェック

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ===== 品質チェック =====
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Format check (Prettier)
        run: npm run format:check --if-present
        continue-on-error: true

      - name: Type check (TypeScript)
        run: npm run typecheck --if-present

  # ===== テスト =====
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage --if-present || npm test --if-present

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true

  # ===== ビルド =====
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

  # ===== セキュリティ: シークレット検出 =====
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== セキュリティ: 依存脆弱性 =====
  dep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # まず警告から、後で必須化

  # ===== セキュリティ: SAST (semgrep) =====
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/secrets
        continue-on-error: true

  # ===== PR チェック（マージ条件） =====
  pr-check:
    if: github.event_name == 'pull_request'
    needs: [quality, test, build, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        run: echo "Quality + test + build + secret-scan passed!"
