# .pre-commit-config.yaml — 標準セキュリティフック（public / internal プロジェクト）
#
# セットアップ:
#   pip install pre-commit
#   pre-commit install
#
# 手動実行:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: "Detect hardcoded secrets"
